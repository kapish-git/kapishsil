name: Build YTDownloader APK

on:
  workflow_dispatch:
  push:
    paths:
      - "YTDownloader/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YTDownloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-arm64-v8a
          path: YTDownloader/app/build/outputs/apk/release/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-armeabi-v7a
          path: YTDownloader/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-universal
          path: YTDownloader/app/build/outputs/apk/release/app-universal-release.apk
