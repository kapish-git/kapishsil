<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BridgeShare</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6c6c70;
    --line: #e5e5ea; --accent: #0a7aff; --ok: #34c759; --err: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --muted: #98989f;
            --line: #2c2c2e; --accent: #0a84ff; --ok: #30d158; --err: #ff453a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin: 8px 4px 20px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent);
          display: grid; place-items: center; color: #fff; font-size: 22px; flex: none; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
         margin-right: 6px; vertical-align: middle; }
  .dot.off { background: var(--err); }
  section { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px;
         font: 600 17px -apple-system, sans-serif; background: var(--accent); color: #fff;
         text-align: center; text-decoration: none; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line);
                   margin-top: 10px; font-size: 15px; padding: 11px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .file:first-child { border-top: 0; }
  .icon { width: 40px; height: 40px; border-radius: 10px; background: var(--bg); flex: none;
          display: grid; place-items: center; font-size: 20px; }
  .meta { flex: 1; min-width: 0; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .size { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 6px; flex: none; }
  .pill { border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600;
          background: var(--bg); color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); padding: 8px 0; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  .done { color: var(--ok); } .fail { color: var(--err); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⇅</div>
    <div>
      <h1>BridgeShare</h1>
      <div class="sub"><span class="dot" id="dot"></span><span id="device">Connecting…</span></div>
    </div>
  </header>

  <section>
    <h2>Send to Android</h2>
    <p class="hint">Pick photos, videos or files. They go straight to the Android phone over Wi-Fi.</p>
    <label class="btn" for="picker">Choose photos or files</label>
    <input type="file" id="picker" multiple>
    <div id="uploads"></div>
  </section>

  <section>
    <h2>Get from Android</h2>
    <p class="hint">Tap <b>Save</b> to download to the Files app. For photos, tap <b>View</b>, then
      press and hold the picture and choose <b>Save to Photos</b>.</p>
    <div id="files"><div class="empty">Loading…</div></div>
    <a class="btn secondary" id="zip" style="display:none">Download all as .zip</a>
  </section>
</div>

<script>
(function () {
  var key = new URLSearchParams(location.search).get('k') || '';
  var q = 'k=' + encodeURIComponent(key);
  var filesEl = document.getElementById('files');
  var uploadsEl = document.getElementById('uploads');
  var lastJson = '';

  function fmt(n) {
    if (n < 0) return '';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : n) + ' ' + u[i];
  }
  function iconFor(mime) {
    if (/^image\//.test(mime)) return '🖼️';
    if (/^video\//.test(mime)) return '🎬';
    if (/^audio\//.test(mime)) return '🎵';
    if (/pdf/.test(mime)) return '📕';
    if (/zip|compressed|archive/.test(mime)) return '🗜️';
    return '📄';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function refresh() {
    fetch('/api/info?' + q, { cache: 'no-store' }).then(function (r) {
      if (r.status === 403) throw new Error('expired');
      return r.json();
    }).then(function (info) {
      document.getElementById('dot').className = 'dot';
      document.getElementById('device').textContent = 'Connected to ' + info.device;
      var json = JSON.stringify(info.files);
      if (json === lastJson) return;
      lastJson = json;
      filesEl.innerHTML = '';
      if (!info.files.length) {
        filesEl.appendChild(el('div', 'empty', 'Nothing shared yet. Add files in the BridgeShare app on Android.'));
      }
      info.files.forEach(function (f) {
        var base = '/d/' + f.id + '/' + encodeURIComponent(f.name) + '?' + q;
        var row = el('div', 'file');
        row.appendChild(el('div', 'icon', iconFor(f.mime)));
        var meta = el('div', 'meta');
        meta.appendChild(el('div', 'name', f.name));
        meta.appendChild(el('div', 'size', fmt(f.size)));
        row.appendChild(meta);
        var act = el('div', 'actions');
        if (/^(image|video)\//.test(f.mime)) {
          var view = el('a', 'pill', 'View');
          view.href = base + '&inline=1';
          view.target = '_blank';
          act.appendChild(view);
        }
        var save = el('a', 'pill', 'Save');
        save.href = base;
        save.setAttribute('download', f.name);
        act.appendChild(save);
        row.appendChild(act);
        filesEl.appendChild(row);
      });
      var zip = document.getElementById('zip');
      zip.style.display = info.files.length > 1 ? 'block' : 'none';
      zip.href = '/zip?' + q;
    }).catch(function (e) {
      document.getElementById('dot').className = 'dot off';
      document.getElementById('device').textContent = e.message === 'expired'
        ? 'Link expired: scan the QR code again'
        : 'Not connected: is BridgeShare still running?';
    });
  }

  // Uploads run one at a time so a slow Wi-Fi link isn't overwhelmed.
  var queue = [], busy = false;
  document.getElementById('picker').addEventListener('change', function (e) {
    Array.prototype.forEach.call(e.target.files, function (file) {
      var row = el('div', 'file');
      row.appendChild(el('div', 'icon', iconFor(file.type || '')));
      var meta = el('div', 'meta');
      meta.appendChild(el('div', 'name', file.name));
      var st = el('div', 'size', 'Waiting · ' + fmt(file.size));
      meta.appendChild(st);
      var bar = el('div', 'bar'); var fill = el('i'); bar.appendChild(fill);
      meta.appendChild(bar);
      row.appendChild(meta);
      uploadsEl.appendChild(row);
      queue.push({ file: file, st: st, fill: fill, bar: bar });
    });
    e.target.value = '';
    next();
  });

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    var job = queue.shift();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?' + q + '&name=' + encodeURIComponent(job.file.name));
    xhr.setRequestHeader('X-File-Type', job.file.type || 'application/octet-stream');
    xhr.upload.onprogress = function (ev) {
      if (!ev.lengthComputable) return;
      var p = Math.round(ev.loaded / ev.total * 100);
      job.fill.style.width = p + '%';
      job.st.textContent = p + '% · ' + fmt(job.file.size);
    };
    xhr.onload = function () {
      if (xhr.status === 200) {
        job.bar.style.display = 'none';
        job.st.textContent = 'Sent ✓ · ' + fmt(job.file.size);
        job.st.className = 'size done';
      } else {
        job.st.textContent = 'Failed (' + xhr.status + ')';
        job.st.className = 'size fail';
      }
      busy = false; next();
    };
    xhr.onerror = function () {
      job.st.textContent = 'Failed: connection lost';
      job.st.className = 'size fail';
      busy = false; next();
    };
    xhr.send(job.file);
  }

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
