plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kapish.bridgeshare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kapish.bridgeshare'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure-Java QR code generator (no AndroidX needed)
    implementation 'com.google.zxing:core:3.5.3'
}
